name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall copies the Draco decoders out of three.js into public/draco.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The built app is handed to the e2e job so it is tested, not rebuilt.
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next
            public
          retention-days: 1

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: build

      # Chromium only. The suite drives WebGL, which on a GPU-less runner falls back to
      # software rasterisation — running three browsers would triple an already slow job
      # for no additional signal.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
